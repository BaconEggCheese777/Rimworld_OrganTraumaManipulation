name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build Source/OrganTraumaMod/OrganTraumaMod.csproj -c Release

      - name: Check DLL exists
        run: ls -l Assemblies/OrganTraumaMod.dll

      - name: Package mod folder
        run: |
          mkdir -p package/OrganTraumaMod
          cp -r About Defs Assemblies package/OrganTraumaMod/
          rm -f package/OrganTraumaMod/Assemblies/*.pdb

      - uses: actions/upload-artifact@v4
        with:
          name: OrganTraumaMod
          path: package
