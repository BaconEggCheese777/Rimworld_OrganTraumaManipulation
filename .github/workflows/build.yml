name: Build mod DLL

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build OrganTrauma/Source/OrganTraumaMod/OrganTraumaMod.csproj -c Release

      - name: Upload built DLL
        uses: actions/upload-artifact@v4
        with:
          name: OrganTraumaMod-dll
          path: OrganTrauma/Assemblies/OrganTraumaMod.dll
